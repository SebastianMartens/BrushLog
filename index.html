<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushLog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>🦷 BrushLog</h1>

    <section class="timer-section">
      <div id="elapsed" class="elapsed">02:00</div>
      <div id="zone" class="zone">&nbsp;</div>
      <button id="toggleBtn" class="toggle-btn">Zähneputzen starten</button>
    </section>

    <section class="stats-section">
      <div class="stats-summary">
        <div class="stat">
          <span id="todayCount" class="stat-value">0</span>
          <span class="stat-label">heute</span>
        </div>
        <div class="stat">
          <span id="totalCount" class="stat-value">0</span>
          <span class="stat-label">gesamt</span>
        </div>
        <div class="stat">
          <span id="streakCount" class="stat-value">0</span>
          <span class="stat-label">Tage in Folge</span>
        </div>
      </div>

      <table id="statsTable">
        <thead>
          <tr>
            <th>Datum</th>
            <th>Start</th>
            <th>Ende</th>
            <th>Dauer</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="statsBody">
        </tbody>
      </table>
      <p id="emptyMsg" class="empty-msg">Noch keine Putzvorgänge erfasst.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
